[package]
name = "target_enterprise"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Enterprise-grade no_std target seed. Every public symbol is an implementation of a cuttle-contracts trait (or a deliberate extension). The morph engine targets this crate for high-stakes morph runs."

[lib]
name = "target_enterprise"
path = "src/lib.rs"

[dependencies]
cuttle-contracts = { path = "../contracts" }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
# SHA-256 + HMAC for the in-target TLS module. Both are no_std-compatible
# with default-features off; `force-soft` prevents x86 SHA-NI/SSE2 XMM
# intrinsics from failing LLVM codegen on soft-float `x86_64-unknown-none`
# debug builds.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

# HTTPS on port 443: the TLS 1.3 protocol is rustls (no_std + alloc, driven
# through its unbuffered API) and the cryptography is RustCrypto, wired in by
# `tls_provider.rs`. No C or assembly, so it builds for soft-float
# `x86_64-unknown-none`; the kernel's .cargo/config.toml sets the
# `*_force_soft` / serial-backend cfgs so no SIMD code is emitted.
# Licenses: rustls Apache-2.0/ISC/MIT; RustCrypto MIT/Apache-2.0; dalek BSD-3-Clause.
rustls = { version = "0.23", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(cuttle_prod)",
    "cfg(aes_force_soft)",
    "cfg(polyval_force_soft)",
    "cfg(chacha20_force_soft)",
    "cfg(poly1305_force_soft)",
    'cfg(curve25519_dalek_backend, values("serial"))',
] }

# Integration tests run as std targets and exercise both the contract
# property-test harness and the no_std skeleton modules (memory bitmap,
# scheduler, etc.). Dev-deps do NOT leak std into the library build.
[dev-dependencies]
cuttle-contracts = { path = "../contracts", features = ["property_tests"] }
# TASK-021: same proptest-driven 32-input p95 perf methodology as
# target_minimal. Lands here so the net-stack work in TASK-011 inherits
# adversarial-input-aware perf coverage from day one rather than needing
# a retrofit.
proptest = { workspace = true }
cuttle-verifier = { path = "../verifier" }
# Independent TLS client for the HTTPS interop tests: rustls with *ring*
# crypto, so the server's RustCrypto provider is checked against a different
# implementation. Test-only; never part of the kernel image.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
