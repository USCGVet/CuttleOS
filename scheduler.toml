# Cuttle factory scheduler configuration.
#
# Entry types:
# - [modules.NAME]: single-module morph target (`target_minimal` demo path).
# - [bundle.NAME]: atomic multi-module morph bundle (`target_enterprise` kernel).
#
# Scheduling formula:
#   (now - last_morph_unix) * priority >= max_age_secs
# Highest priority wins among due entries; ties break to oldest `last_morph_unix`.

[modules.lib]
priority = 10
max_age_secs = 3600
target_dir = "target_minimal/src"
manifest = "target_minimal/manifest.txt"

# Atomic kernel bundle (`target_enterprise`).
# All listed modules are diversified and verified together each cycle; if any
# module fails verification, the entire bundle is rejected and no files change.
# Security-critical files that must not be morphed are listed in `locked_modules.toml`.
[bundle.kernel]
priority = 10
max_age_secs = 3600
workspace = "target_enterprise"
modules = [
    "tls",             # TLS 1.3 handshake, HKDF, and record layer
    "wal",             # Write-ahead log with CRC32 framing and crash recovery
    "iommu",           # IOMMU domain/device mapping and DMA translation
    "net",             # IPv4 and UDP packet parser/builder
    "nvme",            # NVMe admin/I/O queue block driver
    "tcp",             # RFC 793 TCP state machine and segment codec
    "http",            # HTTP/1.1 request parser and response builder
    "dns",             # RFC 1035 DNS query/response wire codec
    "icmp",            # RFC 792 ICMP echo and RFC 1071 checksum
    "ethernet",        # IEEE 802.3 Ethernet II + 802.1Q VLAN frame codec
    "arp",             # RFC 826 IPv4-over-Ethernet ARP codec and cache
    "dhcp",            # RFC 2131/2132 DHCP client state machine and wire codec
    "virtio_net",      # VirtIO 1.0 network device driver
    "virtio_blk",      # VirtIO 1.0 block device driver
    "e1000",           # Intel 82540EM Gigabit Ethernet driver
    "firewall",        # Stateless 5-tuple and CIDR packet filter
    "tpm",             # TCG TPM 2.0 command builder and response parser
    "audit",           # Fixed-capacity tamper-evident security audit ring
    "sntp",            # RFC 4330 SNTPv4 wire codec and clock offset arithmetic
    "vfs",             # Virtual filesystem mount table and in-memory RAMFS
    "ebpf",            # Bounded 64-bit eBPF instruction verifier and interpreter
    "smp",             # ACPI MADT parser, INIT-SIPI-SIPI AP bring-up, PerCpu storage
    "tftp",            # RFC 1350/2347 TFTP wire codec
    "pci",             # PCI Mechanism #1 bus enumerator and BAR/MSI-X decoder
    "x509",            # Strict DER X.509 v3 certificate parser (Ed25519/P-256/RSA)
    "timer",           # PIT 8253/8254 and MC146818 CMOS RTC driver
    "kat",             # FIPS 180-4 / RFC 4231 / RFC 5869 cryptographic KAT suite
    "jfs",             # Journaled filesystem superblock/inode/directory walker
    "gdbstub",         # GDB Remote Serial Protocol packet codec
    "quota",           # Per-UID disk quota enforcement table
    "hpet",            # High Precision Event Timer register driver
    "stack_canary",    # Stack canary minting and verification
    "keyboard",        # PS/2 Set-1 scancode decoder
    "fat32",           # FAT32 BPB and root directory reader
    "watchdog",        # Hardware watchdog timer state machine
    "random",          # Entropy pool seed mixer
    "power",           # ACPI PM1a S5 soft-off encoder
    "elf64",           # ELF64 header and PT_LOAD segment parser
    "serial16550",     # 16550 UART initialization and TX driver
    "tick_source",     # PIT/HPET monotonic tick multiplexer
    "virtio_pci_caps", # VirtIO PCI capability list walker
    "sigkat",          # RFC 8032 Ed25519 signature KAT suite
    "multiboot2",      # Multiboot2 information structure tag walker
    "crc32c",          # CRC32-C (Castagnoli) checksum
    "acpi_rsdp",       # ACPI RSDP v1 descriptor parser
    "frame_bitmap",    # Physical page-frame bitmap allocator codec
    "ioapic",          # I/O APIC redirection table encoder
    "lapic_icr",       # Local APIC Interrupt Command Register encoder
    "gpt",             # GUID Partition Table header and entry parser
    "dns_name",        # DNS wire label encoder and pointer decompressor
    "hmac_drbg",       # NIST SP 800-90A HMAC-SHA256 DRBG
    "ahci_fis",        # SATA AHCI Register H2D FIS encoder
    "xhci_trb",        # USB xHCI Transfer Request Block codec
    "uefi_gop",        # UEFI Graphics Output Protocol mode info codec
    "attest_tlv",      # Binary TLV attestation record codec
    "base64",          # RFC 4648 Base64 encoder/decoder
    "ahci_cmd",        # AHCI command header and PRDT descriptor builder
    "panic_dump",      # 16 KiB post-mortem crash dump encoder/decoder
    "symbols",         # Binary-search ELF symbol table resolver
    "lived_net",       # Guest Ethernet/ARP/ICMP/UDP/HTTP network service demux
    "durable_seal",    # SHA-256 and keyed HMAC-SHA256 durable state sealing
    "scheduler",       # Round-robin task scheduler
    "memory",          # 4 KiB physical page-frame allocator
    "gdt",             # x86-64 Global Descriptor Table and TSS descriptor codec
    "interrupts",      # x86-64 256-vector IDT gate descriptor codec
    "syscall",         # Capability-gated (`CapProof`) syscall dispatch table
    "shell",           # Interactive OS console shell and subsystem runtime (`OsShell`)
    "sql",             # Embedded zero-allocation relational SQL engine (`SqlDb`)
]
