    "timer",      # TASK-062: PicTimer + Rtc contracts + PIT 8253/8254 + MC146818 CMOS RTC wire codec + RecordingIoPort harness + 30 tests
    "kat",        # TASK-063: KatRunner contract + FIPS 180-4 / RFC 4231 / RFC 5869 known-answer suite (9 vectors) + 28 tests
