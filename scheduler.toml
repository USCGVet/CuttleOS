    "serial16550", # TASK-075: 16550 UART init/TX codec
    "tick_source", # TASK-076: PIT/HPET tick mux
    "virtio_pci_caps", # TASK-077: VirtIO PCI capability walker
    "sigkat",     # TASK-078: Ed25519 RFC 8032 KAT harness
