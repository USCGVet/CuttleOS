[toolchain]
# The `bootloader = "0.11"` build script invokes nested cargo builds for
# its BIOS / UEFI stages that require nightly (build-std, -Z flags).
# Pin nightly here so this packager works regardless of the parent
# shell's default toolchain — mirrors the sibling `rustos-builder` crate.
channel = "nightly"
components = ["rust-src", "llvm-tools-preview"]
