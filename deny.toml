# cargo-deny policy for CuttleOS.
#
# CuttleOS is Apache-2.0 (see LICENSE). Every dependency must be under a
# permissive license, so that:
#   - CuttleOS itself can be distributed as open source under Apache-2.0, and
#   - products built on top of it (such as a commercial ERP) can stay
#     proprietary.
# Copyleft licenses (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL, SSPL, ...) are not
# on the allow list, so any crate that brings one in fails the check. A crate
# offering a choice ("MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes, because
# we take one of the permissive options.
#
# Run for each Cargo workspace in the repository (tools/license_check.ps1 does
# all three):
#   cargo deny check licenses bans sources
#   cargo deny --manifest-path target_enterprise_kernel/Cargo.toml check licenses bans sources
#   cargo deny --manifest-path factory_builder_pkg/Cargo.toml check licenses bans sources
# The bootable image's own third-party notices are generated by
# tools/third_party_notices.py into THIRD_PARTY_NOTICES.md.

[graph]
all-features = false
no-default-features = false

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is policy, not inventory: allowed-but-unused licenses are fine.
unused-allowed-license = "allow"

[licenses.private]
# First-party crates are checked too: each declares Apache-2.0.
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# Narrow, documented exceptions only. Everything else fails the gate.
ignore = [
    # crypto-bigint 0.5.5: constant-time timing variability. Fixed only in
    # crypto-bigint >= 0.7.6, which no released p256/elliptic-curve 0.13.x
    # accepts; pulled in solely via p256 0.13 in target_enterprise. Remove
    # once we migrate to p256 0.14 / elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "no compatible fix for p256 0.13 (crypto-bigint 0.5 line); track p256 0.14 migration" },
    # paste 1.0.15: unmaintained (informational, no vulnerability). Build-time
    # proc-macro pulled in via ratatui 0.29 (operator TUI in morph_engine).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via ratatui; no safe upgrade available" },
]
