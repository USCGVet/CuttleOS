[workspace]
resolver = "2"
members = [
    "contracts",
    "diversifier",
    "verifier",
    "morph_engine",
    "target_minimal",
    "target_enterprise",
    "factory_builder",
    "experiments/diversity_demo",
    "tools/dedup_diag",
    "mtd_metrics",
    "binmorph",
]
# Out-of-workspace crates:
#
# - `target_enterprise_kernel/` builds against the bare-metal
#   `x86_64-unknown-none` target via `unstable.build-std`. Requires a
#   nightly toolchain + `rust-src` component. NOT part of the default
#   `cargo build --workspace` invocation. Driven on demand by
#   `factory_builder build-kernel --kernel-crate ...`.
exclude = ["target_enterprise_kernel", "factory_builder_pkg"]

[workspace.package]
edition = "2024"
version = "0.0.1"
authors = ["Proteus Research"]
license = "Apache-2.0"

[workspace.dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Property-based testing harness used by target crates and the verifier.
proptest = { version = "1" }

# Emit line tables only in dev builds to keep test binary debug symbols compact.
[profile.dev]
debug = "line-tables-only"
