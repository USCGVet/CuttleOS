# TASK-022 — operator-curated set of acceptable factory binary
# fingerprints. Every accepted attestation entry minted under
# `morph run --strict-factory` (or audited via `morph verify-attest
# --strict-factory`) must declare a `factory_binaries` map that is a
# subset of the values listed here.
#
# Each component has a list of acceptable hashes so the operator can
# stage transitions (build a new rustc, add its hash, run a cycle,
# verify the new entries pass, then prune the old hash).
#
# Regenerate the starter block at any time with:
#     morph factory-fingerprint --toml
#
# Bootstrap values below: sha256 of the workspace's `target/debug/`
# binaries as built on the iteration-22 morph host. These are NOT
# stable across cargo builds (incremental compilation changes the
# bytes); production deployments should pin the release-profile
# hashes. The hash recorded for `rustc` is sha256 of `rustc -vV`
# output, which IS stable for a given installed toolchain.

required = ["diversify", "morph", "rustc", "verify"]

[components]
diversify = ["452ded39418f017d22642b585ec8d3409c767d3fdd0f96f5edf4bcb71ca89881"]
morph     = ["a351bc81c03674ed6ad6b0ea5dca377a1c9f01e98eb9f755270b30827db80ff6"]
rustc     = ["96eb622879c08d0220b718ea40805c6c06543692b1f8bc8d288599fde906cb68"]
verify    = ["f5ad4b354eb188d46bd0d81769f6bbd5af785ce1bacd7e1079c4a758570ff2b7"]
