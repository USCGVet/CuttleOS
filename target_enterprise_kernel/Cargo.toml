[package]
name = "target_enterprise_kernel"
version = "0.0.1"
edition = "2021"
description = "Bootable kernel ELF for target_enterprise. Out-of-workspace because it builds for x86_64-unknown-none with build-std (nightly + rust-src)."
license = "Apache-2.0"

# Empty workspace marker — same reason as factory_builder_pkg: keep the
# main Cuttle workspace on stable / std-host while this crate uses
# nightly + bare-metal target.
[workspace]

[dependencies]
bootloader_api = "0.11"
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
# Global heap for rustls (HTTPS on port 443). Apache-2.0/MIT.
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
target_enterprise = { path = "../target_enterprise" }
cuttle-contracts = { path = "../contracts" }

[[bin]]
name = "target_enterprise_kernel"
path = "src/main.rs"

# `cuttle_prod` is injected via RUSTFLAGS by
# `factory_builder build-kernel --prod` (see src/main.rs crate header).
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(cuttle_prod)"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
debug = false
strip = false

[profile.dev]
opt-level = 1
panic = "abort"
debug = false
