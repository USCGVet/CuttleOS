name: Cuttle OS CI & Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Build, Differential Equivalence, Triad Faults & QEMU Multi-Seed Boot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3

      - name: Install pinned Rust nightly toolchain (nightly-2026-10-22)
        run: |
          if rustup toolchain install nightly-2026-10-22 --profile minimal --component rust-src --component llvm-tools-preview; then
            rustup default nightly-2026-10-22
          else
            rustup toolchain install nightly --profile minimal --component rust-src --component llvm-tools-preview
            rustup default nightly
            sed -i 's/nightly-2026-10-22/nightly/g' target_enterprise_kernel/rust-toolchain.toml factory_builder_pkg/rust-toolchain.toml
          fi
          rustc -vV
          cargo -vV

      - name: Build bare-metal kernel ELF (x86_64-unknown-none)
        run: |
          (cd target_enterprise_kernel && cargo build --release)

      - name: Run x86-64 differential equivalence suite (synthetic + 500+ real kernel ELF functions across 32 seeds)
        run: |
          cargo test -p cuttle-binmorph --test differential_equiv -- --nocapture

      - name: Run independent MTD metrics verifier & dataflow chain simulation suite
        run: |
          python3 tools/verify_metrics_independent.py --self-test
          cargo test -p cuttle-mtd-metrics --test independent_verifier -- --nocapture

      - name: Run Triad controller AST check & Byzantine/RAID-5 XOR fault-injection tests
        run: |
          python3 -c "import ast; ast.parse(open('tools/triad_controller.py', encoding='utf-8').read())"
          python3 tools/triad_controller.py --unit-test

      - name: Run full Cargo workspace test suite
        run: |
          cargo test --workspace --no-fail-fast
          rm -rf experiments/diversity_demo/results

      - name: Run bare-metal QEMU smoke, AHCI tamper, and multi-seed morphed kernel boot continuity tests
        run: |
          cargo test -p factory_builder --test qemu_smoke -- --ignored --nocapture
