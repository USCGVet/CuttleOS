# Cuttle factory attestation public keyset.
#
# `primary` corresponds to the operator's `factory_signing_key.bin` at the
# workspace root. The repository ships with only `primary` (`threshold = 1`);
# M-of-N threshold attestation (`verify-attest --require-threshold`) requires
# the operator to enroll independent co-signer public keys here and set
# `threshold >= 2`. Test fixture seeds (`morph_engine/tests/fixtures/federation/`)
# and published RFC 8032 example keys are rejected by verification.

threshold = 1

[[signers]]
id = "primary"
pubkey_hex = "90d8794cb0bf462c7fc422c8936cc6f133becddef71883794fb4931865da30df"
