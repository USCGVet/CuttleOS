[package]
name = "cuttle-mtd-metrics"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Moving-target-defense measurement harness. Quantifies how much a morph cycle actually perturbs the compiled attack surface (ROP/JOP gadget churn)."

[[bin]]
name = "mtd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Parse compiled artifacts (COFF on Windows hosts, ELF for the kernel
# target) and pull their `.text` section.
object = "0.36"
# Pure-Rust x86-64 decoder + formatter. Used to enumerate gadgets in a
# `.text` byte stream and to render each gadget's normalized identity.
iced-x86 = "1"
# Diversify the built-in specimen in-process so the harness measures the
# project's real morph pipeline, not a reimplementation of it.
cuttle-diversifier = { path = "../diversifier" }

[dev-dependencies]
cuttle-binmorph = { path = "../binmorph" }
