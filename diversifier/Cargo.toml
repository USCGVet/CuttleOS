[package]
name = "cuttle-diversifier"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "AST-level mutation. Takes a Rust source file, emits N functionally-equivalent variants."

[[bin]]
name = "diversify"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
# `toml` parses the workspace-rooted `locked_modules.toml` policy file
# in `src/locked.rs`. Standalone dep — workspace doesn't currently
# declare a shared toml version.
toml = "0.8"
