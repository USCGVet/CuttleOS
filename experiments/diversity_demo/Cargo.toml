[package]
name = "diversity_demo"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "TASK-015 — empirical morph-diversity / synthetic-exploit-survival demonstration. Drives the full synthesize=passthrough -> diversify -> verify -> sign -> emit-ELF pipeline for N cycles, measures .text Hamming distance + symbol-table churn, and writes a numbers-not-placeholders REPORT.md."

[lib]
name = "diversity_demo"
path = "src/lib.rs"

[[bin]]
name = "diversity_demo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read-only ELF parser. Pure Rust, no FFI. Lets us extract `.text` bytes
# and walk the symbol table for the survival harness without shelling out
# to `objdump` / `nm` / `readobj`.
object = { version = "0.36", default-features = false, features = ["read", "std"] }
# Demangle Rust ELF symbol names (both legacy `_ZN...` and v0 `_R...`).
# Used by `pick_chain_symbols` so the survival probe can target real
# morphed-module symbols (`target_enterprise::tls::hkdf_expand_label`)
# rather than landing on whichever bottom-offset kernel helper happens
# to come first in the symbol table — see TASK-025 / iteration 16.
rustc-demangle = "0.1"
cuttle-diversifier = { version = "0.0.1", path = "../../diversifier" }
factory_builder = { version = "0.0.1", path = "../../factory_builder" }
# TASK-122: gadget positional/semantic survival on real kernel ELFs
# (north-star G5 — measured binary diversity, not prose).
cuttle-mtd-metrics = { version = "0.0.1", path = "../../mtd_metrics" }
# `--bundle <name>` (TASK-036 Phase B) reads scheduler.toml to resolve
# bundle membership. Same `toml = "0.8"` the diversifier already pulls
# in for locked_modules.toml — keeps the version surface uniform.
toml = "0.8"
