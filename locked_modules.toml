# Cuttle locked modules — workspace-relative paths that `cuttle-diversifier`
# refuses to modify.
#
# `diversifier::diversify_path` loads this file from the workspace root before
# applying any transformation and returns `Err(DiversifyError::LockedModule)`
# if the target path matches an entry below. A missing `locked_modules.toml`
# is treated as a hard error.

schema_version = 1

locked = [
    # Immutable trait and wire-format contract definitions.
    "contracts/src/lib.rs",
    "contracts/src/core_primitives.rs",
    "contracts/src/tls_and_crypto.rs",
    "contracts/src/net_protocols.rs",
    "contracts/src/security_and_diag.rs",
    "contracts/src/mm_and_isolation.rs",
    "contracts/src/storage_and_fs.rs",
    "contracts/src/virtio_and_nic.rs",
    "contracts/src/arch_and_platform.rs",

    # KPTI trampoline byte sequences and page-table isolation invariants.
    "target_enterprise/src/kpti.rs",

    # HTTPS: rustls integration (RustCrypto provider, certificate encoder,
    # per-connection driver, golden replay) and its recorded fixture. These
    # implement external rustls traits whose method names and byte-exact
    # outputs (KAT vectors, golden transcript) are pinned.
    "target_enterprise/src/tls_provider.rs",
    "target_enterprise/src/https.rs",
    "target_enterprise/src/https_golden_fixture.rs",

    # Bare-metal kernel entry point, hardware drivers, key provisioning, and boot banners.
    "target_enterprise_kernel/src/main.rs",
    "target_enterprise_kernel/src/heap.rs",
    "target_enterprise_kernel/src/provisioning.rs",
    "target_enterprise_kernel/src/banners_tls_net.rs",
    "target_enterprise_kernel/src/banners_storage_fs.rs",
    "target_enterprise_kernel/src/banners_security_crypto.rs",
    "target_enterprise_kernel/src/banners_arch_platform.rs",
    "target_enterprise_kernel/src/banners_compose.rs",
    "target_enterprise_kernel/src/hw_storage_drivers.rs",
    "target_enterprise_kernel/src/hw_net_drivers.rs",
    "target_enterprise_kernel/src/net_service.rs",

    # Deterministic test vectors and expected outputs used by boot self-checks.
    "target_enterprise/src/kernel_fixtures.rs",
]
