# Proteus locked modules — paths the diversifier MUST refuse to morph.
#
# A locked module is one whose machine-code byte-for-byte stability is a
# *security* guarantee, not a stylistic preference. Morphing these files
# could re-order critical sequences (e.g. KPTI's CR3-swap-before-register-
# save discipline), silently breaking the security boundary the rest of
# the system depends on.
#
# How enforcement works:
#   1. `diversifier::diversify_path(file_path, seed)` reads this file at
#      call time, canonicalises both this list and `file_path`, and
#      returns `Err(DiversifyError::LockedModule)` if a match is found.
#   2. Callers (morph_engine, diversity_demo, any other host tool) must
#      use `diversify_path` rather than the lower-level `diversify(source,
#      seed)` so the check is in the critical path.
#   3. The verifier-side cross-check (assert locked-file content is
#      bit-identical between cycles) is a follow-up task (TASK-032).
#
# Paths are workspace-relative. The diversifier locates the workspace
# root by walking up from the candidate's file path until it finds a
# `locked_modules.toml`. Missing file = fatal error in the diversify call
# (no silent fallback).
#
# Bumping the schema version is the contract-versioning lever: any change
# to the lock-policy semantics requires a schema bump so attestations
# from before/after the change are distinguishable.

schema_version = 1

# Initial lock set. Add new entries as new locked surfaces land.
locked = [
    # The contract surface itself. Renaming or reordering a trait method
    # here changes the API every target_* crate must implement. Even
    # "stylistically equivalent" rewrites are forbidden because the
    # canonical-AST hash drives attestation schema versioning.
    "contracts/src/lib.rs",
    "contracts/src/core_primitives.rs",
    "contracts/src/tls_and_crypto.rs",
    "contracts/src/net_protocols.rs",
    "contracts/src/security_and_diag.rs",
    "contracts/src/mm_and_isolation.rs",
    "contracts/src/storage_and_fs.rs",
    "contracts/src/virtio_and_nic.rs",
    "contracts/src/arch_and_platform.rs",

    # KPTI port (TASK-017). The trampoline-blob byte sequences and the
    # CR3-swap discipline in build_user_view are LOAD-BEARING. The
    # diversifier producing "let x = ...; let y = ...;" reorderings
    # inside the trampoline emit functions could silently re-order the
    # CR3 swap relative to the register save, breaking the kernel ↔ user
    # isolation boundary. Lock it.
    "target_enterprise/src/kpti.rs",

    # The bootable kernel shell and its submodules. Morphing main.rs or
    # its banner/hardware submodules would shuffle the boot-banner
    # sequence (which the QEMU smoke test depends on) and the
    # proof-banner emission order (which the attestation log depends
    # on). Boot code is by definition the un-morphable seed of the
    # whole system.
    "target_enterprise_kernel/src/main.rs",
    "target_enterprise_kernel/src/provisioning.rs",
    "target_enterprise_kernel/src/banners_tls_net.rs",
    "target_enterprise_kernel/src/banners_storage_fs.rs",
    "target_enterprise_kernel/src/banners_security_crypto.rs",
    "target_enterprise_kernel/src/banners_arch_platform.rs",
    "target_enterprise_kernel/src/banners_compose.rs",
    "target_enterprise_kernel/src/hw_storage_drivers.rs",
    "target_enterprise_kernel/src/hw_net_drivers.rs",
    "target_enterprise_kernel/src/net_service.rs",

    # Locked fixtures (Phase C). `kernel_fixtures.rs` declares the
    # `const` inputs and expected outputs that the kernel banner
    # exercises (`banner_iommu_translate`, `banner_net_build`,
    # `banner_kpti`, `banner_dma`, `banner_nvme`, etc.) consume by name.
    # A morph that renamed any of these constants OR perturbed their
    # values would silently drift the banners away from the QEMU smoke
    # test's required-banner list. The kernel boot's correctness depends
    # on these bytes being bit-stable across morph cycles, so the file
    # is locked.
    "target_enterprise/src/kernel_fixtures.rs",
]
